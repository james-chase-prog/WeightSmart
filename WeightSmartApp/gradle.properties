# Use Android Studio?s bundled 64-bit JDK 17
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr

# Memory & encoding
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g

# AndroidX / R class behavior
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin style
kotlin.code.style=official

# Build performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# KAPT diagnostics (still used for Hilt only)
kapt.verbose=true
kapt.incremental.apt=false

# Quiet noisy warnings
org.gradle.warning.mode=summary

# (Extra safety for Windows + SQLite native extraction)
org.sqlite.tmpdir=C:/Users/%USERNAME%/AppData/Local/Temp
