spring.application.name=weight-smart-server

# Activate dev profile by default (override with SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=dev

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Run schema.sql after Hibernate DDL (needed for PostgreSQL-specific index types)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
